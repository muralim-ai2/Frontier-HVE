<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Solution map explorer</title>
<style>:root{--bg:#0d1320;--panel:#151d2e;--panel2:#1b2539;--line:#2a3652;--text:#e7ecf6;--muted:#93a1bb;--accent:#4f8cff;--hit:#ffe066}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font:13px/1.45 "Segoe UI",system-ui,sans-serif}
#app{display:grid;grid-template-columns:minmax(0,1fr) clamp(300px,34vw,440px);grid-template-rows:auto auto minmax(0,1fr);height:100vh}
header{grid-column:1/3;display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center;padding:8px 12px;background:var(--panel);border-bottom:1px solid var(--line)}
header h1{font-size:15px;margin:0 6px 0 0;white-space:nowrap}
input,textarea,select,button{font:inherit;color:var(--text);background:var(--panel2);border:1px solid var(--line);border-radius:6px}
input{width:100%;padding:6px 10px}
select{padding:5px 6px;max-width:220px}
button{padding:5px 10px;cursor:pointer;white-space:nowrap}
button:hover{border-color:var(--accent)}
button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.seg{display:flex}
.seg button{border-radius:0;margin-left:-1px}
.seg button:first-child{border-radius:6px 0 0 6px}
.seg button:last-child{border-radius:0 6px 6px 0}
.group{display:flex;gap:4px;align-items:center;color:var(--muted)}
.search{position:relative;flex:1;min-width:220px;max-width:460px}
#results{position:absolute;top:34px;left:0;right:0;z-index:10;background:var(--panel);border:1px solid var(--line);border-radius:6px;max-height:440px;overflow:auto;display:none;box-shadow:0 8px 24px #000a}
#results div{padding:6px 10px;cursor:pointer;display:flex;gap:8px;align-items:baseline}
#results div.sel,#results div:hover{background:var(--panel2)}
#results small{color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;flex:none}
.badge{font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:0 5px;flex:none;white-space:nowrap}
#banner{grid-column:1/3;display:none;align-items:center;gap:10px;padding:6px 12px;background:#2a2410;border-bottom:1px solid #6b5a1a;color:#ffe9a8}
#banner.on{display:flex}
#banner span{flex:1}
#stage{position:relative;overflow:hidden}
canvas,#tree{display:block;width:100%;height:100%;cursor:grab}
#tree{position:absolute;inset:0;display:none}
#tree .tnode{cursor:pointer;transition:transform .5s cubic-bezier(.2,.8,.2,1)}
#tree .tnode:hover text{fill:#ffffff}
#tree .tnode:hover circle:first-child{stroke-width:3.5}
#tree .tlinks{opacity:0;transition:opacity .45s ease .25s}
#tree .tlinks.on{opacity:1}
@media (prefers-reduced-motion: reduce){#tree .tnode,#tree .tlinks{transition:none}}
#tip{position:absolute;pointer-events:none;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:6px 9px;max-width:380px;display:none;box-shadow:0 4px 16px #0008;z-index:5}
#tip b{display:block}
#tip span{color:var(--muted)}
#hint{position:absolute;left:12px;bottom:10px;color:var(--muted);font-size:12px;pointer-events:none}
aside{background:var(--panel);border-left:1px solid var(--line);overflow:auto;padding:10px 14px}
aside h2,#details h3{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:16px 0 6px}
textarea{width:100%;height:96px;padding:8px;font:12px/1.4 Consolas,monospace;resize:vertical}
.row{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
.row select{flex:1}
#qmsg{color:var(--muted);margin-top:6px;font-size:12px}
#qmsg.err{color:#ff6b6b}
table{width:100%;border-collapse:collapse;font-size:12px;margin-top:6px}
th,td{text-align:left;padding:3px 5px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--muted);font-weight:600}
a{color:var(--accent);cursor:pointer;text-decoration:none}
a:hover{text-decoration:underline}
.crumbs{color:var(--muted);font-size:12px}
.name{font-size:16px;font-weight:600;margin:2px 0 4px}
.explain{margin:8px 0;padding:8px 10px;background:var(--panel2);border-left:3px solid var(--accent);border-radius:4px}
.src{font:12px Consolas,monospace;color:var(--muted);word-break:break-all}
.path{display:flex;flex-wrap:wrap;gap:4px;align-items:center;font-size:12px;color:var(--muted);margin:6px 0}
.path b{color:var(--text);font-weight:600}
details{margin:3px 0}
details summary{cursor:pointer}
details details{margin-left:14px}
.file{margin:3px 0 3px 14px}
.file .p{color:var(--muted);font-size:12px}
.fns{margin:2px 0 4px 14px;font-size:12px;color:var(--muted)}
.fns code{color:#c9d3e6;font:12px Consolas,monospace}
ul{margin:4px 0 8px;padding-left:16px}
li{margin:2px 0}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chat{margin-top:12px;padding:8px 10px;border:1px dashed var(--line);border-radius:6px;color:var(--muted);font-size:12px}
.chat code{color:var(--text)}
.legend div,.legend label{display:flex;align-items:center;gap:6px;margin:2px 0;cursor:pointer}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.swatch{width:18px;height:3px;flex:none;display:inline-block}
.meta{margin-top:14px;color:var(--muted);font-size:12px}
</style>
</head>
<body>
<div id="app">
  <header>
    <h1 id="title">Solution map</h1>
    <div class="seg" id="hier" title="How the map is grouped"><button data-hier="concepts">Concepts</button><button data-hier="architecture">Architecture</button></div>
    <div class="seg" id="views" title="How the map is drawn"><button data-view="tree">Tree</button><button data-view="pack">Circles</button><button data-view="force">Force</button></div>
    <select id="concept" title="Filter to one concept"></select>
    <div class="search">
      <input id="q" placeholder="Search: name, file, purpose ( / )" autocomplete="off">
      <div id="results"></div>
    </div>
    <div class="group" id="levels">Levels <button data-level="1">1</button><button data-level="2">2</button><button data-level="3">3</button><button data-level="4">4</button></div>
    <button id="fit">Fit</button>
  </header>
  <div id="banner"><span id="bannerText"></span><button id="back">&#9664; Back</button><button id="whole">Show whole map</button></div>
  <div id="stage">
    <canvas id="c"></canvas>
    <svg id="tree"></svg>
    <div id="tip"></div>
    <div id="hint"></div>
  </div>
  <aside>
    <div id="details"></div>
    <h2>Cypher query</h2>
    <textarea id="cypher" spellcheck="false"></textarea>
    <div class="row"><select id="examples"></select><button id="run">Run</button></div>
    <div id="qmsg">MATCH (a:label {prop:'v'})-[:type]-&gt;(b) WHERE a.prop CONTAINS 'x' RETURN a, b LIMIT n. Labels: level, kind, view, language or a concept id. Ctrl+Enter runs and filters.</div>
    <div id="qout"></div>
    <h2 id="legendTitle">Colours</h2>
    <div class="legend cols" id="legend"></div>
    <h2>Edge types</h2>
    <div class="legend cols" id="types"></div>
    <div class="meta" id="meta"></div>
  </aside>
</div>

:"file:tools/skills/evaluate.py","members":["file:extension/agents/hve-skill-evaluator.agent.md","file:extension/agents/hve-skill-judge.agent.md","file:extension/agents/hve-skill-worker.agent.md","file:skills/registry.json","file:tools/skills/eval_skill.py","file:tools/skills/evaluate.py","file:tools/skills/import_eval.py","file:tools/skills/micro_eval.py","file:tools/skills/onboard.py","file:tools/skills/scan.py","file:tools/skills/triage.py"],"derived":false,"questions":["How is a skill admitted?","How is skill lift measured?","What does the security scan check?"]},{"id":"concept:packs","name":"Expertise packs (plugins)","explain":"An expertise pack is a plugin that carries one practice's knowledge: agents, skills, templates, a lifecycle, knowledge documents and rubrics, declared in hve-plugin.json (schema in schemas/). manifest.py validates a pack and measures each asset in tokens; plugin.py installs, enables and removes packs in the global store (~/.frontier-hve); store.py lists the packs a workspace can use; route.py decides which packs a request is about. When an ask starts, lifecycle_catalog.py routes the request to a pack lifecycle, ask_packs.py records the chosen packs and their token load in the contract, and stage_evidence.py checks a stage's evidence and rework. compose.py adds a pack's rubrics to the evaluation; packs.js installs packs in the editor and renders their agents.","keywords":["plugin","plugins","pack","packs","expertise pack","plugin architecture","hve-plugin","marketplace"],"start":"file:tools/plugins/manifest.py","members":["file:examples/plugins/oracle-offering/README.md","file:examples/plugins/oracle-offering/agents/oracle-db-architect.agent.md","file:examples/plugins/oracle-offering/agents/oracle-engineer.agent.md","file:examples/plugins/oracle-offering/categories.json","file:examples/plugins/oracle-offering/evaluation/oracle-offering.eval.json","file:examples/plugins/oracle-offering/hve-plugin.json","file:examples/plugins/oracle-offering/knowledge/common-fixes.md","file:examples/plugins/oracle-offering/knowledge/migration-process-map.md","file:examples/plugins/oracle-offering/lifecycles/oracle-migration.json","file:examples/plugins/oracle-offering/registry.json","file:examples/plugins/oracle-offering/skills/oracle-performance-tuning/SKILL.md","file:examples/plugins/oracle-offering/skills/oracle-schema-design/SKILL.md","file:examples/plugins/oracle-offering/templates/oracle-assessment-v1.md","file:examples/plugins/oracle-offering/templates/oracle-migration-runbook-v1.md","file:examples/plugins/oracle-offering/templates/oracle-solution-design-v1.md","file:examples/plugins/oracle-offering/tests/routing.json","file:extension/packs.js","file:schemas/hve-plugin.schema.json","file:tools/evaluation/compose.py","file:tools/loop/ask_packs.py","file:tools/loop/lifecycle_catalog.py","file:tools/loop/stage_evidence.py","file:tools/plugins/author.py","file:tools/plugins/manifest.py","file:tools/plugins/plugin.py","file:tools/plugins/route.py","file:tools/plugins/store.py","store:pack-store"],"derived":false,"questions":["How does a request get routed to a pack?","How do I author and test a pack?","How much context does a pack add?"]},{"id":"concept:telemetry","name":"Telemetry and metrics","explain":"Telemetry has two sources. Hooks write what they see per session into .hve/runs/<session>: metrics.py joins tool-call events with token counts, agent_ledger.py records sub-agent starts and stops, and interventions.py logs every deny, block and stop. Copilot's own OpenTelemetry export (.hve/runs/copilot-otel.jsonl) carries tokens, cost and cache per chat call; the extension's research-telemetry command turns it on, otel_trim.py keeps it small and otel_prune.py archives it per benchmark run. trajectory.py, collect.py and provenance.py read both to show context growth, collect runs and prove which harness parts left evidence. Product agents do not run metrics.py, so per-call tokens are measured only in research runs le:tools/loop/lifecycle.py","file:tools/loop/lifecycle_catalog.py","file:tools/loop/loop_paths.py","file:tools/loop/stage_evidence.py","store:contract","store:plan","store:provenance","store:loaded-skills"],"derived":false,"questions":["How is a lifecycle chosen?","What is in contract.json?","How is the provenance report built?"]},{"id":"concept:feature-loop","name":"Verified feature loop","explain":"Code is built one verified feature at a time. loop.py init locks feature_list.json with a shell check per feature and starts git; next picks the next failing feature; verify runs its check, commits on success, or records the attempt and asks diagnose.py which single fix rule applies, escalating to the human after repeated failures. loop_guard.py stops agents from editing the lock, marking features done themselves or pushing unverified work; guard_mode.json sets whether it enforces or advises. The engineer persona runs this loop for build stages.","keywords":["loop","feature","feature list","verify","check","attempt","diagnose","escalate","lock"],"start":"file:tools/loop/loop.py","members":["file:extension/agents/hve-engineer.agent.md","file:hooks/guard_mode.json","file:hooks/loop_guard.py","file:init.sh","file:plugins/harness-assist/skills/feature-checklist/SKILL.md","file:plugins/harness-assist/skills/run-tests/SKILL.md","file:tools/loop/diagnose.py","file:tools/loop/loop.py","file:tools/loop/loop_paths.py","store:feature-list"],"derived":false,"questions":["What happens when a check fails?","What may an agent not edit?","How are features locked?"]},{"id":"concept:guards","name":"Guards and hooks","explain":"Hooks run before or after every tool call, prompt and sub-agent, as middleware between the model and the workspace. Policy guards deny or stop: module_guard.py blocks files over 500 lines, no_fallback.py rejects code that hides errors, error_guard.py pauses after a streak of failed commands, budget.py enforces a time budget, loop_guard.py protects loop state and flow_guard.py keeps creator-flow stages on their edges. guard_policy.py lets the user waive a guard after repeated trips. Context hooks add information: compaction.py tells sub-agents what to return, profile_detector.py learns user preferences, template_guard.py announces template policy. hve_paths.py locates .hve state for all of them.","keywords":["guard","hook","hooks","middleware","deny","block","waiver","module size","fallback","error streak","budget"],"start":"file:hooks/guard_policy.py","members":["file:hooks/budget.py","file:hooks/compaction.py","file:hooks/error_guard.py","file:hooks/flow_guard.py","file:hooks/guard_mode.json","file:hooks/guard_policy.py","file:hooks/hve_paths.py","file:hooks/loop_guard.py","file:hooks/module_guard.py","file:hooks/no_fallback.py","file:hooks/plan_check.py","file:hooks/profile_detector.py","file:hooks/template_guard.py"],"derived":false,"questions":["Which guard blocked me and why?","How do I add a hook to an agent?","Can a guard be waived?"]},{"id":"concept:deliverables","name":"Deliverable templates and backlog","explain":"Documents such as a PRD, a technical design and a test strategy are created from versioned templates. manage.py resolves which template applies (bundled, configured, or from a pack), initializes the document with provenance markers and validates its sections; template_guard.py announces the policy and checks registered deliverables when a session stops. The product manager persona writes a PRD this way and turns it into a backlog that backlog.py validates against the PRD's requirements.","keywords":["template","templates","prd","design spec","tds","test strategy","deliverable","backlog","product manager"],"start":"file:tools/templates/manage.py","members":["file:extension/agents/hve-product-manager.agent.md","file:hooks/template_guard.py","file:plugins/harness-assist/skills/deliverable-templates/SKILL.md","file:templates/deliverables/catalog.json","file:templates/deliverables/config.schema.json","file:templates/deliverables/prd-v1.md","file:templates/deliverables/technical-design-v1.md","file:templates/deliverables/test-strategy-v1.md","file:tools/backlog/backlog.py","file:tools/templates/manage.py","store:deliverables"],"derived":false,"questions":["Which template does a PRD use?","How is a design spec validated?","How is the backlog traced to the PRD?"]},{"id":"concept:evaluation","name":"Output evaluation","explain":"Finished work is judged before it is handed over. contract.py loads the evaluation contract (evaluation/frontier.eval.json: rubrics, validation hooks, council roles and thresholds); workflow.py scores each rubric with grounded evidence, runs the validation hooks that apply, and asks three reviewer roles (critical, balanced, coach) through the evaluation-reviewer agent; reflection.py is the CLI and makes the decision: pass, revise or human review. compose.py adds the rubrics of the expertise packs in use.","keywords":["evaluation","rubric","council","reviewer","score","reflection","validation hook","quality"],"start":"file:tools/evaluation/workflow.py","members":["file:.github/agents/evaluation-reviewer.agent.md","file:evaluation/frontier.eval.json","file:extension/agents/hve-evaluation-reviewer.agent.md","file:plugins/harness-assist/skills/output-evaluation/SKILL.md","file:tools/evaluation/compose.py","file:tools/evaluation/contract.py","file:tools/evaluation/reflection.py","file:tools/evaluation/workflow.py","store:evaluations"],"derived":false,"questions":["How is a pass decided?","How do pack rubrics combine with the core rubrics?"]},{"id":"concept:extension","name":"VS Code extension","explain":"The harness ships as one VSIX. build.py copies hooks/, tools/, skills and templates into extension/runtime and checks every runtime path the agent templates name; package.json declares the commands and settings. On activation extension.js finds Python, renders the agents (render.js) into a plugin folder registered with Copilot Chat, sets up the workspace's const PALETTE = ["#4f8cff", "#2ed3a0", "#ff5fa2", "#ffa94d", "#a77bff", "#29c5f6", "#f6c453", "#ff4d5e", "#c9e265", "#ff8c61",

  imports: "#4f8cff", invokes: "#ffa94d", "guarded-by": "#ff4d5e", uses: "#9fb3cf", writes: "#f6c453", "delegates-to": "#ff5fa2",
  "tested-by": "#7d8597", "documented-in": "#c48e9a", "decided-in": "#ff8c61"

const STRUCTURAL = new Set(["contains", "includes"]);

const G = {nodes: new Map(), edges: [], out: new Map(), inc: new Map(), parent: new Map(), children: new Map(),

const S = {hier: "concepts", view: "force", edgesOn: new Set(["imports", "invokes", "guarded-by", "uses", "writes", "delegates-to"]),

  const only = S.filter && S.filter.concepts.size ? S.filter.concepts : null;
  const drop = i => { i.keep = false; i.children.forEach(drop); return false; };
  const walk = (i, inside) => {
    if (only && i.concept && !only.has(i.concept.id)) return drop(i);
    const self = !S.filter || inside || (i.ref && S.filter.ids.has(i.ref.id));
    let any = self;
    for (const c of i.children) if (walk(c, self && !!S.filter)) any = true;
    i.keep = any;
    return any;
  };
  walk(t.root, false);
}

/** Open every instance shallower than the level. */
function setLevel(level) {
  S.level = level;
  const t = tree();
  t.expanded.clear();
  const walk = i => { if (i.depth < level && i.children.length) { t.expanded.add(i.key); i.children.forEach(walk); } };
  walk(t.root);
  revealScope();
}

/** Open the ancestors of every filtered node so the filter's nodes are on screen. */
function revealScope() {
  if (!S.filter) return;
  const t = tree();
  for (const id of S.filter.ids) for (const i of t.idx.get(id) || []) for (let p = i.parent; p; p = p.parent) t.expanded.add(p.key);
}

/** Expand ancestors so a map node shows, and return its first instance in the current hierarchy. */
function reveal(id) {
  const t = tree(), list = (t.idx.get(id) || []).filter(i => i.keep !== false);
  if (!list.length) return null;
  for (let p = list[0].parent; p; p = p.parent) t.expanded.add(p.key);
  return list[0];
}

/** Return the instances on screen: kept, and under expanded parents only. */
function visible() {
  const t = tree(), out = [];
  const walk = i => { if (!i.keep) return; out.push(i); if (t.expanded.has(i.key)) i.children.forEach(walk); };
  walk(t.root);
  return out;
}

/** Return the nearest on-screen ancestor-or-self of an instance. */
function rep(i) {
  const t = tree(), chain = [];
  for (let p = i; p; p = p.parent) chain.push(p);
  for (let k = chain.length - 1; k > 0; k--) if (!t.expanded.has(chain[k].key)) return chain[k];
  return i;
}

/** Return the map's typed links rolled up to the instances on screen. */
function links() {
  const t = tree(), agg = new Map();
  for (const e of G.edges) {
    if (STRUCTURAL.has(e.type) || !S.edgesOn.has(e.type)) continue;
    for (const a of t.idx.get(e.f) || []) {
      if (!a.keep) continue;
      for (const b of t.idx.get(e.t) || []) {
        if (!b.keep) continue;
        const ra = rep(a), rb = rep(b);
        if (ra === rb) continue;
        const key = ra.key + "|" + rb.key + "|" + e.type;
        (agg.get(key) || agg.set(key, {a: ra, b: rb, type: e.type, items: []}).get(key)).items.push(e);
      }
    }
  }
  return [...agg.values()];
}

/** Apply a filter of map node ids, remembering the previous one for Back. */
function applyFilter(label, ids) {
  S.history.push(S.filter);
  S.filter = ids ? {label, ids: new Set(ids), concepts: new Set(ids.filter(id => id.startsWith("concept:")))} : null;
  for (const t of Object.values(S.trees)) markKeep(t);
  setLevel(S.level);
}

/** Return to the previous filter, or the whole map when there is none. */
function back() {
  S.filter = S.history.pop() || null;
  for (const t of Object.values(S.trees)) markKeep(t);
  setLevel(S.level);
}

/** Return a node id with its direct, non-structural neighbours. */
function neighbourhood(id) {
  const ids = [id];
  for (const e of G.out.get(id)) if (!STRUCTURAL.has(e.type)) ids.push(e.t);
  for (const e of G.inc.get(id)) if (!STRUCTURAL.has(e.type)) ids.push(e.f);
  return ids;
}

/** Return the ids a node stands for when filtering: a concept's members, else the node and its neighbours. */
function scopeOf(id) {
  const c = G.concepts.find(x => x.id === id);
  return c ? [c.id, ...c.members] : neighbourhood(id);
}

/** Return a fuzzy score of a query word against a text, or -1. */
function fuzzy(q, s) {
  s = (s || "").toLowerCase();
  const i = s.indexOf(q);
  if (i >= 0) return 60 + q.length * 4 - i * 0.2 + (i === 0 || /[\W_]/.test(s[i - 1]) ? 25 : 0) - s.length * 0.05;
  let si = 0, score = 0, run = 0;
  for (const ch of q) {
    const j = s.indexOf(ch, si);
    if (j < 0) return -1;
    run = j === si ? run + 1 : 0;
    score += 1 + run * 2 + (j === 0 || /[\W_]/.test(s[j - 1]) ? 4 : 0) - Math.min(3, (j - si) * 0.1);
    si = j + 1;
  }
  return score - s.length * 0.05;
}

/** Return the map nodes that best match free text, concepts first on ties. */
function search(text, limit) {
  const words = text.toLowerCase().split(/\s+/).filter(Boolean);
  if (!words.length) return [];
  const rank = {concept: 6, system: 0, view: 4, module: 3, file: 2, symbol: 1};
  const scored = [];
  for (const n of G.nodes.values()) {
    let total = 0;
    for (const w of words) {
      const s = Math.max(fuzzy(w, n.name), fuzzy(w, n.id) * 0.8, (n.purpose || "").toLowerCase().includes(w) ? 30 : -1,
        n.level === "concept" && (G.concepts.find(c => c.id === n.id).keywords || []).some(k => k.toLowerCase().includes(w)) ? 90 : -1);
      if (s < 0) { total = -1; break; }
      total += s;
    }
    if (total >= 0) scored.push([total + rank[n.level] * 3, n]);
  }
  return scored.sort((a, b) => b[0] - a[0]).slice(0, limit || 14).map(s => s[1]);
}

/** Return a concept as folders, files, functions, connections, dependencies, tests, docs and decisions. */
function conceptCard(c) {
  const members = new Set(c.members), folders = new Map();
  for (const m of c.members) {
    const n = G.nodes.get(m);
    if (n.level !== "file") continue;
    const dir = groupOf(n).name;
    const fns = G.children.get(m).map(id => G.nodes.get(id)).filter(s => s.kind === "function" || s.kind === "class");
    (folders.get(dir) || folders.set(dir, []).get(dir)).push({node: n, fns});
  }
  const conn = new Map(), deps = new Set(), tests = new Set(), docs = new Set(), decisions = new Set();
  const label = id => { const k = G.conceptOf.get(fileOf(id)); return k ? {key: k.id, name: k.name} : {key: id, name: G.nodes.get(id).name}; };
  for (const m of members) {
    for (const e of G.out.get(m)) {
      if (e.type === "tested-by") tests.add(e.t);
      else if (e.type === "documented-in") docs.add(e.t);
      else if (e.type === "decided-in") decisions.add(e.t);
      else if (!STRUCTURAL.has(e.type) && !members.has(e.t)) { const l = label(e.t); const k = "out|" + e.type + "|" + l.key; (conn.get(k) || conn.set(k, {dir: "uses", type: e.type, l, items: []}).get(k)).items.push(e); }
    }
    for (const e of G.inc.get(m)) {
      if (["imports", "invokes", "guarded-by", "delegates-to"].includes(e.type) && !members.has(e.f)) { const l = label(e.f); const k = "in|" + e.type + "|" + l.key; (conn.get(k) || conn.set(k, {dir: "used by", type: e.type, l, items: []}).get(k)).items.push(e); }
    }
    for (const x of G.nodes.get(m).external || []) deps.add(x);
  }
  return {folders, connections: [...conn.values()].sort((a, b) => b.items.length - a.items.length), external: [...deps].sort(),
    tests: [...tests], docs: [...docs], decisions: [...decisions]};
}

S.trees = {concepts: conceptTree(), architecture: architectureTree()};
for (const t of Object.values(S.trees)) markKeep(t);

/** Cypher subset over the solution map: MATCH patterns, WHERE, RETURN and LIMIT. */

/** Split a query into tokens. */
function tokenize(src) {
  const re = /\s+|(\/\/[^\n]*)|('(?:[^'\\]|\\.)*'|"(?:[^"\\]|\\.)*")|(-?\d+(?:\.\d+)?)|(`[^`]+`|[A-Za-z_](?:\w|-(?=\w))*)|(<-|->|<>|!=|>=|<=|=~|\.\.|[()[\]{}:,.|\-*=<>])/y;
  const out = [];
  re.lastIndex = 0;
  while (re.lastIndex < src.length) {
    const at = re.lastIndex, m = re.exec(src);
    if (!m) throw new Error("Unexpected character at " + at + ": " + src.slice(at, at + 12));
    if (m[2]) out.push({t: "str", v: m[2].slice(1, -1).replace(/\\(.)/g, "$1")});
    else if (m[3]) out.push({t: "num", v: Number(m[3])});
    else if (m[4]) out.push({t: "id", v: m[4].replace(/`/g, "")});
    else if (m[5]) out.push({t: "sym", v: m[5]});
  }
  return out;
}

/** Parse the supported Cypher subset into {pattern, where, ret, limit}. */
function parseCypher(src) {
  const T = tokenize(src);
  let i = 0, anon = 0;
  const peek = () => T[i];
  const isKw = w => T[i] && T[i].t === "id" && T[i].v.toUpperCase() === w;
  const isSym = v => T[i] && T[i].t === "sym" && T[i].v === v;
  const fail = what => { throw new Error("Expected " + what + " at token " + (i + 1) + (T[i] ? " ('" + T[i].v + "')" : " (end)")); };
  const sym = v => { if (!isSym(v)) fail("'" + v + "'"); i++; };
  const kw = w => { if (!isKw(w)) fail(w); i++; };
  const ident = () => { if (!T[i] || T[i].t !== "id") fail("a name"); return T[i++].v; };
  const value = () => {
    const t = T[i];
    if (t && (t.t === "str" || t.t === "num")) { i++; return t.v; }
    if (t && t.t === "id" && /^(true|false)$/i.test(t.v)) { i++; return t.v.toLowerCase() === "true"; }
    return fail("a value");
  };
  const props = () => {
    const p = {};
    if (!isSym("{")) return p;
    i++;
    while (!isSym("}")) { const k = ident(); sym(":"); p[k] = value(); if (isSym(",")) i++; else break; }
    sym("}");
    return p;
  };
  const labels = into => { if (isSym(":")) { i++; into.push(ident()); while (isSym("|")) { i++; if (isSym(":")) i++; into.push(ident()); } } };
  const node = () => {
    sym("(");
    const n = {v: null, labels: [], props: {}};
    if (peek() && peek().t === "id") n.v = ident();
    labels(n.labels);
    n.props = props();
    sym(")");
    n.v = n.v || "_n" + anon++;
    return n;
  };
  const rel = () => {
    const r = {v: null, types: [], dir: "any", props: {}};
    const left = isSym("<-");
    if (left) i++; else sym("-");
    if (isSym("[")) {
      i++;
      if (peek() && peek().t === "id") r.v = ident();
      labels(r.types);
      r.props = props();
      sym("]");
    }
    if (left) { sym("-"); r.dir = "in"; } else if (isSym("->")) { i++; r.dir = "out"; } else sym("-");
    r.v = r.v || "_r" + anon++;
    return r;
  };
  const operand = () => {
    if (peek() && peek().t === "id" && !/^(true|false)$/i.test(peek().v)) {
      const v = ident();
      if (isSym(".")) { i++; return {ref: v, prop: ident()}; }
      return {ref: v, prop: "id"};
    }
    return {lit: value()};
  };
  const comparison = () => {
    const left = operand();
    let op;
    if (isKw("CONTAINS")) { i++; op = "CONTAINS"; }
    else if (isKw("STARTS")) { i++; kw("WITH"); op = "STARTS"; }
    else if (isKw("ENDS")) { i++; kw("WITH"); op = "ENDS"; }
    else if (isKw("IN")) { i++; op = "IN"; }
    else if (peek() && peek().t === "sym" && ["=", "<>", "!=", "=~", ">", "<", ">=", "<="].includes(peek().v)) op = T[i++].v;
    else fail("an operator");
    if (op !== "IN") return {op, left, right: operand()};
    sym("[");
    const list = [];
    while (!isSym("]")) { list.push(value()); if (isSym(",")) i++; else break; }
    sym("]");
    return {op, left, right: {lit: list}};
  };
  const factor = () => {
    if (isKw("NOT")) { i++; return {not: factor()}; }
    if (isSym("(")) { i++; const e = expr(); sym(")"); return e; }
    return comparison();
  };
  const term = () => { let e = factor(); while (isKw("AND")) { i++; e = {and: [e, factor()]}; } return e; };
  const expr = () => { let e = term(); while (isKw("OR")) { i++; e = {or: [e, term()]}; } return e; };

  kw("MATCH");
  const pattern = {nodes: [node()], rels: []};
  while (isSym("-") || isSym("<-")) { pattern.rels.push(rel()); pattern.nodes.push(node()); }
  let where = null, ret = null, limit = 200;
  if (isKw("WHERE")) { i++; where = expr(); }
  if (isKw("RETURN")) {
    i++; ret = [];
    if (isKw("DISTINCT")) i++;
    do { if (isSym(",")) i++; const v = ident(); ret.push(isSym(".") ? (i++, {ref: v, prop: ident()}) : {ref: v}); } while (isSym(","));
  }
  if (isKw("LIMIT")) { i++; limit = value(); }
  if (i < T.length) fail("end of query");
  return {pattern, where, ret, limit};
}

/** Return whether a value is a bound edge rather than a node. */
function isEdge(x) { return x && "f" in x && "t" in x; }

/** Return a property of a bound node or edge; concept returns the file's first concept name. */
function prop(x, p) {
  if (!x) return undefined;
  if (isEdge(x)) return {type: x.type, evidence: x.ev, from: x.f, to: x.t}[p];
  if (p === "degree" || p === "connections") return x.agg;
  if (p === "children") return G.children.get(x.id).length;
  if (p === "concept") { const c = G.conceptOf.get(fileOf(x.id)); return c ? c.name : undefined; }
  return x[p];
}

/** Return whether a node carries a label: its level, kind, view, language, id prefix or a concept it belongs to. */
function hasLabel(n, l) {
  l = l.toLowerCase();
  if (n.level === l || n.kind === l || n.view === l || n.lang === l || n.id.toLowerCase().startsWith(l + ":")) return true;
  const c = G.concepts.find(x => x.id === "concept:" + l);
  return !!c && c.members.includes(fileOf(n.id));
}

/** Return whether a node or edge matches inline properties. */
function propsOk(x, props) { return Object.entries(props).every(([k, v]) => String(prop(x, k)) === String(v)); }

/** Evaluate a WHERE expression on a binding; text operators ignore case. */
function evaluate(e, b) {
  if (e.and) return evaluate(e.and[0], b) && evaluate(e.and[1], b);
  if (e.or) return evaluate(e.or[0], b) || evaluate(e.or[1], b);
  if (e.not) return !evaluate(e.not, b);
  const get = o => "lit" in o ? o.lit : prop(b[o.ref], o.prop);
  const a = get(e.left), c = get(e.right);
  if (a === undefined || a === null) return e.op === "<>" || e.op === "!=";
  const s = String(a).toLowerCase(), t = String(c).toLowerCase();
  switch (e.op) {
    case "=": return String(a) === String(c);
    case "<>": case "!=": return String(a) !== String(c);
    case "CONTAINS": return s.includes(t);
    case "STARTS": return s.startsWith(t);
    case "ENDS": return s.endsWith(t);
    case "=~": return new RegExp("^(?:" + c + ")$", "i").test(String(a));
    case "IN": return c.map(String).includes(String(a));
    case ">": return +a > +c;
    case "<": return +a < +c;
    case ">=": return +a >= +c;
    case "<=": return +a <= +c;
  }
  return false;
}

/** Run a parsed query and return its rows of bindings. */
function execute(q) {
  const {pattern, where, limit} = q, rows = [], b = {};
  const nodeOk = (n, np) => (!np.labels.length || np.labels.some(l => hasLabel(n, l))) && propsOk(n, np.props) && (!b[np.v] || b[np.v] === n);
  const step = (k, cur) => {
    if (rows.length >= limit) return;
    if (k === pattern.rels.length) { if (!where || evaluate(where, b)) rows.push({...b}); return; }
    const r = pattern.rels[k], np = pattern.nodes[k + 1], cands = [];
    if (r.dir !== "in") for (const e of G.out.get(cur.id)) cands.push([e, e.t]);
    if (r.dir !== "out") for (const e of G.inc.get(cur.id)) cands.push([e, e.f]);
    for (const [e, oid] of cands) {
      if ((r.types.length && !r.types.includes(e.type)) || !propsOk(e, r.props) || (b[r.v] && b[r.v] !== e)) continue;
      const o = G.nodes.get(oid);
      if (!nodeOk(o, np)) continue;
      const pn = b[np.v], pr = b[r.v];
      b[np.v] = o; b[r.v] = e;
      step(k + 1, o);
      b[np.v] = pn; b[r.v] = pr;
      if (rows.length >= limit) return;
    }
  };
  for (const n of G.nodes.values()) {
    if (!nodeOk(n, pattern.nodes[0])) continue;
    b[pattern.nodes[0].v] = n;
    step(0, n);
    delete b[pattern.nodes[0].v];
    if (rows.length >= limit) break;
  }
  return rows;
}

/** Explorer views: force diagram, collapsible tree and zoomable circle packing over the current hierarchy. */

const canvas = document.getElementById("c"), ctx = canvas.getContext("2d"), svg = document.getElementById("tree");
const SPRING = [0, 300, 95, 48, 26, 18];
const MOTION = !window.matchMedia("(prefers-reduced-motion: reduce)").matches;
let W = 0, H = 0, dpr = 1, dirty = true;

/** Size the canvas buffer to the stage, so drawings are never stretched when the banner, panel or window change. */
function resize() {
  const r = document.getElementById("stage").getBoundingClientRect();
  dpr = window.devicePixelRatio || 1;
  W = Math.max(1, r.width); H = Math.max(1, r.height);
  canvas.width = Math.round(W * dpr); canvas.height = Math.round(H * dpr); dirty = true;
}

/** Return a node's gentle floating offset in screen pixels at a time. */
function drift(i, t) {
  if (!MOTION) return [0, 0];
  const ph = i.phase === undefined ? (i.phase = Math.random() * Math.PI * 2) : i.phase;
  return [Math.sin(t * 0.0011 + ph) * 2.2, Math.cos(t * 0.0009 + ph * 1.7) * 2.2];
}

/** Return whether an instance or one under it is marked by a query or filter highlight. */
function marked(i) { return !!(S.mark && i.ref && S.mark.has(i.ref.id)); }

/** Draw a label with a dark halo at screen coordinates. */
function label(text, x, y, bold, dim) {
  ctx.font = (bold ? "600 13px" : "11px") + " Segoe UI, system-ui, sans-serif";
  ctx.lineWidth = 4; ctx.strokeStyle = "#0d1320"; ctx.lineJoin = "round";
  ctx.strokeText(text, x, y);
  ctx.fillStyle = dim ? "#56617a" : bold ? "#ffffff" : "#c9d3e6";
  ctx.fillText(text, x, y);
}

/** Return a name shortened to a length. */
function short(name, n) { return name.length > n ? name.slice(0, n - 1) + "\u2026" : name; }

// ---------- force ----------
const Force = {vis: [], visSet: new Set(), hier: [], links: [], alpha: 1, v: {x: 0, y: 0, k: 1}, drag: null, autoFit: 0};

/** Recompute what the force view shows, seeding new nodes outward from their parent. */
Force.refresh = function () {
  this.vis = visible(); this.visSet = new Set(this.vis);
  for (const n of this.vis) {
    if (n.x !== undefined) continue;
    const p = n.parent;
    if (!p || p.x === undefined) { n.x = 0; n.y = 0; } else {
      const sibs = p.children.filter(c => c.keep), i = sibs.indexOf(n), gp = p.parent;
      const base = gp && gp.x !== undefined ? Math.atan2(p.y - gp.y, p.x - gp.x) : -Math.PI / 2;
      const spread = gp ? Math.min(Math.PI * 0.9, 0.35 * sibs.length) : Math.PI * 2;
      const a = gp ? base - spread / 2 + spread * (i + 0.5) / sibs.length : base + spread * i / sibs.length;
      const d = SPRING[Math.min(n.depth, 5)] + p.r;
      n.x = p.x + Math.cos(a) * d; n.y = p.y + Math.sin(a) * d;
    }
    n.vx = 0; n.vy = 0;
  }
  this.hier = this.vis.filter(n => n.parent && this.visSet.has(n.parent)).map(n => ({a: n.parent, b: n}));
  this.links = links();
  this.alpha = Math.max(this.alpha, 0.7);
  dirty = true;
};

/** Advance the layout one step; return false once it has settled. */
Force.tick = function () {
  if (this.alpha < 0.004) return false;
  const vis = this.vis, n = vis.length;
  for (const a of vis) { a.fx = 0; a.fy = 0; }
  for (let i = 0; i < n; i++) {
    const a = vis[i];
    for (let j = i + 1; j < n; j++) {
      const b = vis[j];
      let dx = b.x - a.x, dy = b.y - a.y, d2 = dx * dx + dy * dy;
      if (d2 > 4e6) continue;
      if (d2 < 1) { dx = Math.random() - 0.5; dy = Math.random() - 0.5; d2 = 1; }
      const d = Math.sqrt(d2), f = 2600 * (1 + (a.r + b.r) / 8) / d2;
      a.fx -= dx / d * f; a.fy -= dy / d * f; b.fx += dx / d * f; b.fy += dy / d * f;
    }
  }
  const spring = (a, b, len, s) => {
    const dx = b.x - a.x, dy = b.y - a.y, d = Math.sqrt(dx * dx + dy * dy) || 1, f = (d - len) * s;
    a.fx += dx / d * f; a.fy += dy / d * f; b.fx -= dx / d * f; b.fy -= dy / d * f;
  };
  for (const h of this.hier) spring(h.a, h.b, SPRING[Math.min(h.b.depth, 5)] + h.a.r, 0.08);
  for (const l of this.links) spring(l.a, l.b, 320, 0.0012 * Math.min(4, 1 + Math.log(l.items.length)));
  for (const a of vis) {
    if (a === this.drag) continue;
    a.fx -= a.x * 0.0015; a.fy -= a.y * 0.0015;
    a.vx = (a.vx + a.fx * this.alpha) * 0.55; a.vy = (a.vy + a.fy * this.alpha) * 0.55;
    a.x += Math.max(-40, Math.min(40, a.vx)); a.y += Math.max(-40, Math.min(40, a.vy));
  }
  this.alpha *= 0.985;
  return true;
};

/** Return the instances to keep bright: a highlight, else the hovered or selected node and its neighbours. */
Force.focus = function () {
  if (S.mark) return new Set(this.vis.filter(i => marked(i) || i.children.some(c => !this.visSet.has(c) && subtreeMarked(c))));
  const n = S.hover || S.selected;
  if (!n || !this.visSet.has(n)) return null;
  const s = new Set([n]);

function filterTo(label, ids, mark, edges) {

}

function wholeMap() {
  S.filter = null; S.history = []; S.mark = null; S.markEdges = null;
  for (const t of Object.values(S.trees)) markKeep(t);
  $("concept").value = "";
  setLevel(2);
  refresh(true);

function openConcept(ids) {

function goTo(id) {
  const c = G.concepts.find(x => x.id === id);
  if (c) return openConcept([id]);
  if (!(S.trees[S.hier].idx.get(id) || []).length) S.hier = "architecture";
  filterTo(G.nodes.get(id).name + " and its connections", neighbourhood(id), [id]);
  const i = reveal(id);
  refresh(true);
  if (i) select(i);
}

/** Select an instance and show its details. */
function select(i) {
  S.selected = i;
  renderDetails();
  if (S.view === "tree") Tree.refresh();
  dirty = true;
}

/** Return a link that filters to a map node. */
function link(id, text) { const a = el("a", text || G.nodes.get(id).name); a.title = G.nodes.get(id).source || id; a.onclick = () => goTo(id); return a; }

/** Render the details panel for the selection. */
function renderDetails() {
  const box = $("details"), i = S.selected;
  box.replaceChildren();
  if (!i || i.level === "root" || i.level === "system") return renderHome(box);
  if (i.level === "concept") return renderConcept(box, i.concept);
  const crumbs = el("div", "", "crumbs");
  const chain = [];
  for (let p = i.parent; p; p = p.parent) chain.unshift(p);
  chain.forEach((p, k) => { if (k) crumbs.append(" \u203a "); const a = el("a", p.name); a.onclick = () => select(p); crumbs.append(a); });
  box.append(crumbs, el("div", i.name, "name"));
  if (i.level === "folder") {
    box.append(el("div", "Folder in concept " + i.concept.name + ".", "crumbs"));
    for (const f of i.children) { const d = el("div", "", "file"); d.append(link(f.ref.id), " ", el("span", f.ref.purpose || "", "p")); box.append(d); }
    return;
  }
  const n = i.ref, tags = el("div", "", "chips");
  for (const t of [n.level, n.view, n.kind, n.agg + " connections", n.tokens ? n.tokens.toLocaleString() + " tokens" : ""]) if (t) tags.append(el("span", t, "badge"));
  const c = G.conceptOf.get(fileOf(n.id));
  if (c) { const a = el("a", "concept: " + c.name); a.onclick = () => openConcept([c.id]); tags.append(a); }
  box.append(tags);
  if (n.purpose) box.append(el("div", n.purpose, "explain"));
  if (n.source) box.append(el("div", n.source, "src"));
  const row = el("div", "", "row"), b1 = el("button", tree().expanded.has(i.key) ? "Collapse" : "Expand"), b2 = el("button", "Filter to this and its connections");
  b1.disabled = !i.children.some(x => x.keep); b1.onclick = () => { toggleInst(i); renderDetails(); };
  b2.onclick = () => goTo(n.id);
  row.append(b1, b2);
  box.append(row);
  for (const [title, list, other] of [["Uses", G.out.get(n.id), e => e.t], ["Used by", G.inc.get(n.id), e => e.f]]) {
    const groups = new Map();
    for (const e of list) if (!STRUCTURAL.has(e.type)) (groups.get(e.type) || groups.set(e.type, []).get(e.type)).push(e);
    if (!groups.size) continue;
    box.append(el("h3", title));
    for (const [type, es] of groups) {
      const head = el("div"), sw = el("span", "", "swatch"), ul = el("ul");
      sw.style.background = EDGE_COLORS[type] || "#888";
      head.append(sw, " " + type + " (" + es.length + ")");
      for (const e of es.slice(0, 25)) { const li = el("li"); li.append(link(other(e))); li.title = e.ev; ul.append(li); }
      if (es.length > 25) ul.append(el("li", "+" + (es.length - 25) + " more"));
      box.append(head, ul);
    }
  }
  const kids = G.children.get(n.id).map(id => G.nodes.get(id));
  if (kids.length) {
    box.append(el("h3", (n.level === "file" ? "Functions and classes" : "Contains") + " (" + kids.length + ")"));
    for (const k of kids.slice(0, 40)) { const d = el("div", "", "file"); d.append(link(k.id), " ", el("span", k.purpose || "", "p")); box.append(d); }
  }
  box.append(chatHint(n.name));
}

/** Render the start card: what the map holds and the concepts to open. */
function renderHome(box) {
  const s = MAP.size;
  box.append(el("div", G.nodes.get("system").name, "name"), el("div", G.nodes.get("system").purpose || "", "explain"),
    el("div", `${s.class} app: ${s.code_files} code files, ${s.code_lines.toLocaleString()} code lines, ${s.files} mapped files.`, "crumbs"),
    el("h3", "Concepts: pick one to see its modules, files, functions and connections"));
  for (const c of G.concepts) {
    const d = el("div", "", "file"), a = el("a", c.name);
    a.onclick = () => openConcept([c.id]);
    d.append(dot(G.color.get(c.id)), " ", a, " ", el("span", (c.explain || "").split(". ")[0], "p"));
    box.append(d);
  }
  if (G.concepts.some(c => c.derived)) box.append(el("div", "These concepts are the top-level folders. Add named concepts with explanations in docs/architecture/solution-map.config.json, or ask the agent to propose them.", "chat"));
  box.append(chatHint("<topic>"));
}

/** Render a concept as Concept, Folders, Files, Functions, Connections, Dependencies and Explanation. */
function renderConcept(box, c) {
  const card = conceptCard(c);
  const path = el("div", "", "path");
  for (const [k, v] of [["Concept", c.name], ["Modules", card.folders.size], ["Files", c.members.length], ["Connections", card.connections.length], ["Dependencies", card.external.length]]) {
    path.append(el("b", k), el("span", String(v)), el("span", "\u203a"));
  }
  path.lastChild.remove();
  box.append(el("div", "Concept", "crumbs"), el("div", c.name, "name"), path, el("div", c.explain || "No explanation yet.", "explain"));
  const start = el("div", "Start at: ", "crumbs");
  start.append(link(c.start));
  box.append(start, el("h3", "Modules, files and functions"));
  for (const [dir, files] of card.folders) {
    const fd = el("details");
    fd.open = card.folders.size <= 4;
    fd.append(el("summary", dir + "  (" + files.length + ")"));
    for (const {node, fns} of files) {
      const d = el("div", "", "file");
      d.append(link(node.id), " ", el("span", node.purpose || "", "p"));
      if (fns.length) {
        const fl = el("details", "", "fns");
        fl.append(el("summary", fns.length + " functions: " + fns.slice(0, 4).map(f => f.name).join(", ") + (fns.length > 4 ? ", \u2026" : "")));
        for (const f of fns) { const r = el("div"); r.append(el("code", f.name), " " + (f.purpose || "")); r.title = f.source; fl.append(r); }
        d.append(fl);
      }
      fd.append(d);
    }
    box.append(fd);
  }
  if (card.connections.length) {
    box.append(el("h3", "Connections"));
    const ul = el("ul");
    for (const x of card.connections.slice(0, 16)) {
      const li = el("li"), sw = el("span", "", "swatch"), a = el("a", x.l.name);
      sw.style.background = EDGE_COLORS[x.type] || "#888";
      a.onclick = () => goTo(x.l.key);
      li.append(sw, ` ${x.dir} (${x.type}) `, a, x.items.length > 1 ? " \u00d7" + x.items.length : "");
      li.title = x.items.slice(0, 8).map(e => e.ev).join("\n");
      ul.append(li);
    }
    box.append(ul);
  }
  if (card.external.length) {
    box.append(el("h3", "External dependencies"));
    const chips = el("div", "", "chips");
    card.external.forEach(x => chips.append(el("span", x, "badge")));
    box.append(chips);
  }
  for (const [title, ids] of [["Tests", card.tests], ["Docs", card.docs], ["Decisions", card.decisions]]) {
    if (!ids.length) continue;
    box.append(el("h3", title + " (" + ids.length + ")"));
    const chips = el("div", "", "chips");
    ids.slice(0, 20).forEach(id => { chips.append(link(id), " "); });
    box.append(chips);
  }
  if ((c.questions || []).length) { box.append(el("h3", "Questions this answers")); const ul = el("ul"); c.questions.forEach(q => ul.append(el("li", q))); box.append(ul); }
  box.append(chatHint(c.name));
}

/** Return the note on asking about a topic in chat. */
function chatHint(topic) {
  const d = el("div", "", "chat");
  d.append("Ask in Copilot, Claude Code or Codex: ", el("code", "/solution-map " + topic), " — or say \"help me understand " + topic + "\".");
  return d;
}

/** Show the tooltip for an instance at the mouse. */
function showTip(i) {
  const tip = $("tip");
  tip.replaceChildren(el("b", i.name + "  \u00b7  " + (i.ref ? i.ref.level + (i.ref.kind ? " (" + i.ref.kind + ")" : "") : i.level)), el("span", i.ref ? i.ref.purpose || "" : (i.concept ? i.concept.explain : "")));
  tip.style.left = Math.min(mouse.x + 14, W - 390) + "px"; tip.style.top = (mouse.y + 14) + "px"; tip.style.display = "block";
}

/** Hide the tooltip. */
function hideTip() { $("tip").style.display = "none"; }

/** Render the colour legend of the current hierarchy. */
function renderLegend() {
  const box = $("legend");
  box.replaceChildren();
  $("legendTitle").textContent = S.hier === "concepts" ? "Concepts" : "Views";
  const items = S.hier === "concepts" ? G.concepts.map(c => [c.id, c.name, G.color.get(c.id)])
    : MAP.nodes.filter(n => n.level === "view").map(n => [n.id, n.name, G.color.get(n.id)]);
  for (const [id, name, color] of items) { const row = el("div"); row.append(dot(color), link(id, name)); box.append(row); }
}

// ---------- search ----------
let found = [], foundIdx = 0;

/** Render the search dropdown. */
function renderFound() {
  const box = $("results");
  box.replaceChildren();
  found.forEach((n, k) => {
    const row = el("div");
    if (k === foundIdx) row.className = "sel";
    row.append(dot(n.level === "concept" ? G.color.get(n.id) : G.color.get("view:" + n.view) || "#9aa5b8"), el("span", n.name), el("span", n.level, "badge"), el("small", n.purpose || n.id));
    row.onmousedown = ev => { ev.preventDefault(); pick(n); };
    box.append(row);
  });
  box.style.display = found.length ? "block" : "none";
}

/** Filter to a search result. */
function pick(n) { $("results").style.display = "none"; $("q").blur(); goTo(n.id); }

$("q").addEventListener("input", () => { found = search($("q").value); foundIdx = 0; renderFound(); });
$("q").addEventListener("keydown", ev => {
  if (ev.key === "ArrowDown") { foundIdx = Math.min(found.length - 1, foundIdx + 1); renderFound(); ev.preventDefault(); }
  if (ev.key === "ArrowUp") { foundIdx = Math.max(0, foundIdx - 1); renderFound(); ev.preventDefault(); }
  if (ev.key === "Enter" && found[foundIdx]) pick(found[foundIdx]);
  if (ev.key === "Escape") { $("results").style.display = "none"; $("q").blur(); }
});
$("q").addEventListener("blur", () => { $("results").style.display = "none"; });

// ---------- cypher ----------
/** Run the query box, filter the map to the matched nodes and list the rows. */
function runQuery() {
  const msg = $("qmsg"), out = $("qout");
  out.replaceChildren();
  let q, rows;
  try { q = parseCypher($("cypher").value.trim()); rows = execute(q); } catch (err) { msg.textContent = err.message; msg.className = "err"; return; }
  msg.className = "";
  msg.textContent = rows.length + " row" + (rows.length === 1 ? "" : "s") + (rows.length >= q.limit ? " (limit reached)" : "") + ". The map is filtered to them.";
  if (!rows.length) return;
  const ns = new Set(), es = new Set();
  for (const row of rows) for (const v of Object.values(row)) { if (isEdge(v)) es.add(v); else if (v) ns.add(v.id); }
  if (![...ns].some(id => (S.trees[S.hier].idx.get(id) || []).length)) S.hier = "architecture";
  filterTo("query (" + rows.length + " rows)", [...ns], [...ns], es.size ? es : null);
  const cols = q.ret || [...q.pattern.nodes.map(n => n.v), ...q.pattern.rels.map(r => r.v)].filter(v => !v.startsWith("_")).map(ref => ({ref}));
  const table = el("table"), head = el("tr");
  cols.forEach(c => head.append(el("th", c.prop ? c.ref + "." + c.prop : c.ref)));
  table.append(head);
  for (const row of rows.slice(0, 300)) {
    const tr = el("tr");
    for (const c of cols) {
      const td = el("td"), v = row[c.ref];
      if (c.prop) td.textContent = String(prop(v, c.prop) ?? "");
      else if (isEdge(v)) { td.textContent = v.type; td.title = v.ev; } else if (v) td.append(link(v.id));
      tr.append(td);
    }
    table.append(tr);
  }
  out.append(table);
}

const EXAMPLES = [
  ["Files in a concept and what they import", "MATCH (f:file)-[:imports]->(g)\nWHERE f.concept = '" + (G.concepts[0] ? G.concepts[0].name.replace(/'/g, "") : "") + "'\nRETURN f, g"],
  ["Agents and the hooks that guard them", "MATCH (a:agent)-[:guarded-by]->(h)\nRETURN a, h"],
  ["Who imports a file (edit the name)", "MATCH (a)-[:imports]->(b)\nWHERE b.name CONTAINS 'build'\nRETURN a, b"],
  ["Code that touches a data store", "MATCH (f)-[:uses]->(s:store)\nRETURN f, s"],
  ["Files and the decisions that name them", "MATCH (f:file)-[:decided-in]->(d:decision)\nRETURN f, d\nLIMIT 60"],
  ["Untested code files", "MATCH (f:code)\nWHERE NOT f.name =~ '.*(test|spec).*'\nRETURN f, f.concept\nLIMIT 80"],
  ["Functions about tokens", "MATCH (n:function)\nWHERE n.purpose CONTAINS 'token'\nRETURN n, n.source\nLIMIT 40"],
  ["Two hops: what an agent's tools import", "MATCH (a:agent)-[:invokes]->(t)-[:imports]->(d)\nRETURN a, t, d\nLIMIT 60"],
  ["Most connected files", "MATCH (f:file)\nWHERE f.degree > 25\nRETURN f, f.degree"],
];
EXAMPLES.forEach(([text], k) => { const o = el("option", text); o.value = k; $("examples").append(o); });
$("examples").onchange = () => { $("cypher").value = EXAMPLES[$("examples").value][1]; runQuery(); };
$("cypher").value = EXAMPLES[1][1];
$("examples").value = 1;
$("run").onclick = runQuery;
$("cypher").addEventListener("keydown", ev => { if (ev.key === "Enter" && ev.ctrlKey) runQuery(); });

// ---------- controls ----------
const conceptSel = $("concept");
conceptSel.append(el("option", "All concepts"));
conceptSel.firstChild.value = "";
for (const c of G.concepts) { const o = el("option", c.name); o.value = c.id; conceptSel.append(o); }
conceptSel.onchange = () => conceptSel.value ? openConcept([conceptSel.value]) : wholeMap();
document.querySelectorAll("[data-hier]").forEach(b => b.onclick = () => setMode(b.dataset.hier, null));
document.querySelectorAll("[data-view]").forEach(b => b.onclick = () => setMode(null, b.dataset.view));
document.querySelectorAll("[data-level]").forEach(b => b.onclick = () => { setLevel(+b.dataset.level); refresh(true); });
$("fit").onclick = () => V().fit();
$("back").onclick = () => { back(); S.mark = null; S.markEdges = null; if (!S.filter) $("concept").value = ""; refresh(true); };
$("whole").onclick = wholeMap;
for (const type of Object.keys(EDGE_COLORS)) {
  const count = G.edges.filter(e => e.type === type).length;
  if (!count) continue;
  const lab = el("label"), cb = el("input"), sw = el("span", "", "swatch");
  cb.type = "checkbox"; cb.checked = S.edgesOn.has(type); cb.style.width = "auto";
  cb.onchange = () => { cb.checked ? S.edgesOn.add(type) : S.edgesOn.delete(type); refresh(false); };
  sw.style.background = EDGE_COLORS[type];
  lab.append(cb, sw, type + " (" + count + ")");
  $("types").append(lab);
}
$("title").textContent = "Solution map: " + G.nodes.get("system").name;
$("meta").textContent = "Commit " + MAP.commit + " \u00b7 built " + MAP.built.slice(0, 10) + " \u00b7 " + MAP.nodes.length + " nodes \u00b7 " + MAP.edges.length + " edges";

// ---------- pointer ----------
const stage = $("stage");
stage.addEventListener("mousedown", ev => {
  const r = stage.getBoundingClientRect();
  mouse.down = true; mouse.moved = false; mouse.sx = ev.clientX; mouse.sy = ev.clientY;
  mouse.node = S.view === "force" ? Force.hit(ev.clientX - r.left, ev.clientY - r.top) : null;
  Force.drag = mouse.node;
});
window.addEventListener("mousemove", ev => {
  const r = stage.getBoundingClientRect();
  mouse.x = ev.clientX - r.left; mouse.y = ev.clientY - r.top;
  if (mouse.down) {
    if (Math.abs(ev.clientX - mouse.sx) + Math.abs(ev.clientY - mouse.sy) > 3) mouse.moved = true;
    if (mouse.node && mouse.moved) { const v = Force.v; mouse.node.x = (mouse.x - W / 2 - v.x) / v.k; mouse.node.y = (mouse.y - H / 2 - v.y) / v.k; Force.alpha = Math.max(Force.alpha, 0.25); dirty = true; }
    else if (mouse.moved) V().pan(ev.movementX, ev.movementY);
    return;
  }
  if (S.view === "tree" || ev.target !== canvas) return;
  const hit = S.view === "force" ? Force.hit(mouse.x, mouse.y) : (Pack.hit(mouse.x, mouse.y) || {}).inst;
  if (hit !== S.hover) { S.hover = hit || null; dirty = true; }
  if (hit) showTip(hit); else hideTip();
});
window.addEventListener("mouseup", ev => {
  if (mouse.down && !mouse.moved && ev.target === canvas) {
    if (S.view === "force" && mouse.node) select(mouse.node);
    if (S.view === "pack") Pack.click(mouse.x, mouse.y);
  }
  mouse.down = false; mouse.node = null; Force.drag = null;
});
canvas.addEventListener("dblclick", () => { if (S.view === "force") { const n = Force.hit(mouse.x, mouse.y); if (n) { toggleInst(n); select(n); } } });
stage.addEventListener("wheel", ev => { ev.preventDefault(); V().zoom(mouse.x - (S.view === "tree" ? 0 : W / 2), mouse.y - (S.view === "tree" ? 0 : H / 2), Math.exp(-ev.deltaY * 0.0015)); }, {passive: false});
window.addEventListener("keydown", ev => {
  const typing = ["INPUT", "TEXTAREA", "SELECT"].includes(document.activeElement.tagName);
  if (ev.key === "/" && !typing) { ev.preventDefault(); $("q").focus(); }
  if (ev.key === "Escape" && !typing && S.filter) $("back").click();
});
new ResizeObserver(() => { resize(); if (S.view === "pack" && Pack.focus) Pack.jump(Pack.focus); }).observe(stage);

/** Animation loop: step the active view and redraw every frame while things move or float. */
function frame() {
  const moving = S.view === "force" ? Force.step() : S.view === "pack" ? Pack.tick() : false;
  if (S.view !== "tree" && (moving || dirty || MOTION)) { V().draw(); dirty = false; }
  requestAnimationFrame(frame);
}

/** Open the page as its hash or the build's focus asks: concept=, q=, node= or cypher=. */
function route() {
  const hash = decodeURIComponent((location.hash || "#" + (MAP.focus || "")).slice(1)).replace(/\+/g, " ");
  const [key, value] = [hash.split("=")[0], hash.slice(hash.indexOf("=") + 1)];
  if (key === "concept" && value) return openConcept(value.split(","));
  if (key === "node" && G.nodes.has(value)) return goTo(value);
  if (key === "cypher" && value) { $("cypher").value = value; return runQuery(); }
  if (key === "q" && value) {
    const hits = search(value, 10);
    if (!hits.length) return;
    if (hits[0].level === "concept") return openConcept([hits[0].id]);
    if (!hits.some(h => (S.trees[S.hier].idx.get(h.id) || []).length)) S.hier = "architecture";
    filterTo("search \u201c" + value + "\u201d", hits.flatMap(h => scopeOf(h.id)), hits.map(h => h.id));
    $("q").value = value;
  }
}

resize();
setLevel(2);
refresh(true);
renderDetails();
route();
window.addEventListener("hashchange", route);
requestAnimationFrame(frame);
</script>
</body>
